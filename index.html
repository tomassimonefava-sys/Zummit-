<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZUMMIT | Reserva de Consolas</title> 
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <div class="logo-container" onclick="renderConsoles()" style="cursor: pointer;">
            <div>
                <div class="titulo-logo">ZUMMIT</div>
                <div class="subtitulo-logo">RESERVÁ. ELEGÍ. JUGÁ.</div>
            </div>
        </div>

        <nav class="pestanas-header">
            <button class="pestana-header" onclick="renderAllGamesGrid()">
                <img src="images/pestañas/joystick.png" alt="Logo 1">
            </button>
            <button class="pestana-header">
                <img src="images/pestañas/persona.png" alt="Logo 2">
            </button>
            <button class="pestana-header">
                <img src="images/pestañas/logo.png" alt="Logo 3">
            </button>
        </nav>

        <div class="contenedor-boton-carrito" onclick="toggleCart()">
            <button class="boton-carrito">CARRITO</button>
            <div class="insignia-carrito" id="cart-badge">0</div>
        </div>
    </header>

    <div class="barra-pasos">
        1. <span id="step-1" class="active">CONSOLA</span> &gt; 
        <span id="step-2">2. JUEGO</span> &gt; 
        <span id="step-3">3. TIEMPO</span> &gt; 
        <span id="step-4">4. FECHA</span>
    </div>

    <div style="max-width: 1200px; margin: 0 auto; width: 80%;">
        <button id="back-btn" class="boton-volver" onclick="goBack()">← Volver</button>
    </div>

    <!-- SECCIÓN GRILLA DE TODOS LOS JUEGOS (MENÚ DE 5 COLUMNAS) -->
    <div class="all-games-section" id="all-games-section" style="display: none; max-width: 1200px; margin: 20px auto; padding: 0 20px;">
        <h2 style="text-align: center; margin-bottom: 20px; color: #fff;">Catálogo de Juegos</h2>
        <div class="games-grid-container" id="games-grid-container" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <!-- 1. SECCIÓN CARRUSEL DE CONSOLAS Y JUEGOS -->
    <div class="contenedor-carrusel" id="carousel-section">
        <button class="boton-navegacion" onclick="moveCarousel(-1)">&#10094;</button>
        <div class="contenedor-pista-carrusel">
            <div class="pista-carrusel" id="carousel-track"></div>
        </div>
        <button class="boton-navegacion" onclick="moveCarousel(1)">&#10095;</button>
    </div>

    <!-- 2. SECCIÓN TIEMPO (SLOTS) -->
    <div class="seleccion-tiempo" id="time-section" style="display: none;">
        <h2 id="selected-game-title">Selecciona el tiempo de uso</h2>
        
        <div class="grilla-tiempo">
            <div class="espacio-tiempo" onclick="selectTime(this, '1 Hora', 15000)">1 Hora<br><small>$15.000</small></div>
            <div class="espacio-tiempo" onclick="selectTime(this, '1 Hr 30 Min', 22500)">1 Hr 30 Min<br><small>$22.500</small></div>
            <div class="espacio-tiempo" onclick="selectTime(this, '2 Horas', 28000)">2 Horas<br><small>$28.000</small></div>
            <div class="espacio-tiempo" onclick="selectTime(this, '2 Hr 30 Min', 37500)">2 Hrs 30 Min<br><small>$37.500</small></div>
            <div class="espacio-tiempo" onclick="selectTime(this, '3 Horas', 40000)">3 Horas<br><small>$40.000</small></div>
            <div class="espacio-tiempo" onclick="selectTime(this, '3 Hr 30 Min', 48500)">3 Hrs 30 Min<br><small>$48.500</small></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="boton-agregar-carrito" id="confirm-time-btn" style="display: none;" onclick="goToDateSelection()">CONFIRMAR</button>
        </div>
    </div>

    <div class="date-vertical-section" id="date-section" style="display: none; text-align: center; max-width: 600px; margin: 20px auto; padding-bottom: 90px;">
        <h2>Selecciona el Día y Mes</h2>
        
        <div class="contenedor-selector-vertical">
            <button class="boton-navegacion-vertical" onclick="moveVerticalPicker(-1)">&#10053; ▲</button>
            <div class="ventana-pista-vertical">
                <div class="pista-vertical" id="vertical-date-track">
                </div>
            </div>
            <button class="boton-navegacion-vertical" onclick="moveVerticalPicker(1)">▼</button>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="boton-agregar-carrito" id="add-to-cart-final-btn" style="display: inline-block;" onclick="addToCart()">AGREGAR AL CARRITO</button>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div class="ventana-modal" id="cart-modal">
        <div class="contenido-modal">
            <div class="cabecera-modal">
                <h2>TU RESERVA</h2>
                <button class="boton-cerrar" onclick="toggleCart()">&times;</button>
            </div>
            <div id="cart-items">
                <p style="color: var(--text-dim);">El carrito está vacío.</p>
            </div>
            <div class="total-carrito" id="cart-total" style="display:none;"></div>
            <button class="boton-pago" onclick="finishPurchase()">CONFIRMAR RESERVA</button>
        </div>
    </div>

    <script>
        const data = [
            {
                id: 'ps5',
                name: 'PlayStation',
                img: 'images/PSlogo.png',
                games: [
                    { name: 'EA Sports FC 26', img: 'images/fifa.jpg' },
                    { name: 'Spider-Man 2', img: 'images/spider.png' },
                    { name: 'GTA V', img: 'images/gta.png' },
                    { name: 'Horizon Forbidden West', img: 'images/horizon.jpg' },
                    { name: 'The Last of Us Part II', img: 'images/last.jpg' }
                ]
            },
            {
                id: 'xbox',
                name: 'Xbox',
                img: 'images/xbox.png',
                games: [
                    { name: 'Forza Horizon 6', img: 'images/forza.webp' },
                    { name: 'Halo Infinite', img: 'images/halo.jpg' },
                    { name: 'Minecraft', img: 'images/minecraft.png' },
                    { name: 'Palword', img: 'images/palword.png' },
                    { name: 'Roblox', img: 'images/roblox.png' }
                ]
            },
            {
                id: 'switch',
                name: 'Nintendo Switch',
                img: 'images/nintendo.png',
                games: [
                    { name: 'Mario Kart 8 Deluxe', img: 'images/mariokart.png' },
                    { name: 'Animal Crossing: New Horizons', img: 'images/animal.png' },
                    { name: 'The Legend of Zelda: Tears of the Kingdom', img: 'images/zelda.png' },
                    { name: 'Super Smash Bros: Ultimate', img: 'images/smashbros.png' },
                    { name: 'Splatoon 3', img: 'images/splatoon.png' }
                ]
            },
            {
                id: 'arcade',
                name: 'Arcade',
                img: 'images/arcade.png',
                games: [
                    { name: 'Tetris (1989)', img: 'images/tetris.png' },
                    { name: 'Donkey Kong (1994)', img: 'images/donkey.png' },
                    { name: 'Street Fighter 2', img: 'images/st2.png' },
                    { name: 'Sonic The Hedgehog (1991)', img: 'images/sonic.png' },
                    { name: 'Metal Slug (1996)', img: 'images/metal.png' }
                ]
            },
            {
                id: 'PC',
                name: 'PC',
                img: 'images/pc.png',
                games: [
                    { name: "Castlevania: Belmont's Curse", img: 'images/castle.png' },
                    { name: 'Cuphead', img: 'images/cuphead.png' },
                    { name: 'Geometry Dash', img: 'images/gd.png' },
                    { name: 'Cyberpunk 2077', img: 'images/cyber.png' },
                    { name: 'R.E.P.O', img: 'images/repo.png' },
                    { name: 'How To Fish', img: 'images/htf.png' },
                    { name: "Hollow Knight  ", img: 'images/hollow.png' },
                    { name: "Five Nights at Freddy's: Security Breach", img: 'images/fnaf.png' },
                    { name: "Undertale", img: 'images/under.png' },
                    { name: "Terraria", img: 'images/terraria.png' }
                ]
            }
        ];

        let currentStep = 1;
        let selectedConsole = null;
        let selectedGame = null;
        let selectedTimeOption = null;
        let selectedDateObj = null;
        let cart = [];
        
        let currentIndex = 0;
        let currentItems = [];

        // Generar días para el carrusel vertical (próximos 30 días)
        let availableDates = [];
        function generateDates() {
            availableDates = [];
            const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const daysOfWeek = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            
            for (let i = 0; i < 30; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                availableDates.push({
                    dayNum: d.getDate(),
                    dayName: daysOfWeek[d.getDay()],
                    monthName: months[d.getMonth()],
                    fullString: `${daysOfWeek[d.getDay()]} ${d.getDate()} de ${months[d.getMonth()]}`
                });
            }
        }
        generateDates();

        let verticalIndex = 0;

        function id(e) { return document.getElementById(e); }
        const track = id('carousel-track');

        function renderConsoles() {
            currentStep = 1;
            updateStepIndicators();
            id('back-btn').style.display = 'none';
            id('time-section').style.display = 'none';
            id('date-section').style.display = 'none';
            id('all-games-section').style.display = 'none';
            id('carousel-section').style.display = 'flex';
            
            currentItems = data;
            buildCarousel(currentItems, (item) => selectConsole(item));
        }

        function renderAllGamesGrid() {
            currentStep = 1;
            updateStepIndicators();
            id('back-btn').style.display = 'block';
            id('carousel-section').style.display = 'none';
            id('time-section').style.display = 'none';
            id('date-section').style.display = 'none';
            id('all-games-section').style.display = 'block';

            const gridContainer = id('games-grid-container');
            gridContainer.innerHTML = '';

            data.forEach(consoleObj => {
                consoleObj.games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'grid-game-card';
                    card.style.cssText = 'background: rgba(20,20,20,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: transform 0.2s;';
                    card.innerHTML = `
                        <img src="${game.img}" alt="${game.name}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 6px;">
                        <h4 style="color: #fff; font-size: 14px; margin: 10px 0 5px 0;">${game.name}</h4>
                        <small style="color: #888;">${consoleObj.name}</small>
                    `;
                    card.onclick = () => {
                        selectedConsole = consoleObj;
                        selectGame(game);
                    };
                    gridContainer.appendChild(card);
                });
            });
        }

        function selectConsole(consoleObj) {
            selectedConsole = consoleObj;
            currentStep = 2;
            updateStepIndicators();
            id('back-btn').style.display = 'block';
            id('time-section').style.display = 'none';
            id('date-section').style.display = 'none';
            id('all-games-section').style.display = 'none';
            id('carousel-section').style.display = 'flex';

            currentItems = consoleObj.games;
            buildCarousel(currentItems, (game) => selectGame(game));
        }

        function buildCarousel(items, onClickCallback) {
            track.innerHTML = '';
            currentIndex = 0;

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.onclick = () => {
                    if (index === currentIndex) {
                        onClickCallback(item);
                    } else {
                        let diff = index - currentIndex;
                        const total = items.length;
                        if (diff > Math.floor(total / 2)) diff -= total;
                        if (diff < -Math.floor(total / 2)) diff += total;
                        moveCarousel(diff);
                    }
                };
                card.innerHTML = `<img src="${item.img}" alt="${item.name}"><h3>${item.name}</h3>`;
                track.appendChild(card);
            });
            updateCards();
        }

        function moveCarousel(direction) {
            const total = currentItems.length;
            if (total === 0) return;
            currentIndex = (currentIndex + direction + total) % total;
            updateCards();
        }

        function updateCards() {
            const cards = track.querySelectorAll('.tarjeta');
            const total = cards.length;

            cards.forEach((card, index) => {
                let offset = index - currentIndex;
                if (offset < -Math.floor(total / 2)) offset += total;
                if (offset > Math.floor(total / 2)) offset -= total;

                let tx = 0, tz = 0, ry = 0, opacity = 0, zIndex = 0;
                if (offset === 0) {
                    tx = 0; tz = 0; ry = 0; opacity = 1; zIndex = 10;
                    card.classList.add('active-card');
                } else if (offset === 1) {
                    tx = 280; tz = -150; ry = -35; opacity = 0.7; zIndex = 5;
                    card.classList.remove('active-card');
                } else if (offset === -1) {
                    tx = -280; tz = -150; ry = 35; opacity = 0.7; zIndex = 5;
                    card.classList.remove('active-card');
                } else {
                    tx = offset > 0 ? 450 : -450; tz = -300; ry = offset > 0 ? -50 : 50; opacity = 0; zIndex = 1;
                    card.classList.remove('active-card');
                }
                card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg)`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
                card.style.pointerEvents = Math.abs(offset) <= 1 ? 'auto' : 'none';
            });
        }

        function selectGame(gameObj) {
            selectedGame = gameObj;
            currentStep = 3;
            updateStepIndicators();

            id('carousel-section').style.display = 'none';
            id('date-section').style.display = 'none';
            id('all-games-section').style.display = 'none';
            id('time-section').style.display = 'block';
            id('selected-game-title').innerText = `${selectedConsole.name} - ${selectedGame.name}`;

            selectedTimeOption = null;
            id('confirm-time-btn').style.display = 'none';
            document.querySelectorAll('.espacio-tiempo').forEach(slot => slot.classList.remove('selected'));
        }

        function selectTime(element, hoursText, price) {
            selectedTimeOption = { hoursText, price };
            document.querySelectorAll('.espacio-tiempo').forEach(slot => slot.classList.remove('selected'));
            element.classList.add('selected');
            
            id('confirm-time-btn').style.display = 'inline-block';
        }

        function goToDateSelection() {
            if (!selectedTimeOption) return;
            currentStep = 4;
            updateStepIndicators();

            id('time-section').style.display = 'none';
            id('date-section').style.display = 'block';
            buildVerticalPicker();
        }

        function buildVerticalPicker() {
            const trackElem = id('vertical-date-track');
            trackElem.innerHTML = '';
            verticalIndex = 0;

            availableDates.forEach((dateObj, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'elemento-vertical' + (index === 0 ? ' active-vertical' : '');
                itemDiv.innerHTML = `<span>${dateObj.dayName}</span> <strong>${dateObj.dayNum}</strong> <span>${dateObj.monthName}</span>`;
                itemDiv.onclick = () => {
                    verticalIndex = index;
                    updateVerticalPickerUI();
                };
                trackElem.appendChild(itemDiv);
            });
            selectedDateObj = availableDates[0];
            updateVerticalPickerUI();
        }

        function moveVerticalPicker(dir) {
            verticalIndex = (verticalIndex + dir + availableDates.length) % availableDates.length;
            updateVerticalPickerUI();
        }

        function updateVerticalPickerUI() {
            const items = id('vertical-date-track').querySelectorAll('.elemento-vertical');
            selectedDateObj = availableDates[verticalIndex];

            items.forEach((item, idx) => {
                item.classList.remove('active-vertical', 'near-vertical');
                let offset = idx - verticalIndex;
                if (offset === 0) {
                    item.classList.add('active-vertical');
                } else if (Math.abs(offset) === 1) {
                    item.classList.add('near-vertical');
                }
            });

            const trackElem = id('vertical-date-track');
            const itemHeight = 60; 
            let translateY = -verticalIndex * itemHeight;
            trackElem.style.transform = `translateY(${translateY}px)`;
        }

        function addToCart() {
            if (!selectedConsole || !selectedGame || !selectedTimeOption || !selectedDateObj) return;

            const item = {
                console: selectedConsole.name,
                game: selectedGame.name,
                hours: selectedTimeOption.hoursText,
                date: selectedDateObj.fullString,
                price: selectedTimeOption.price
            };

            cart.push(item);
            updateCartUI();
            
            selectedTimeOption = null;
            selectedDateObj = null;

            // --- LIMPIEZA Y DESELECCIÓN ---
            selectedTimeOption = null;
            selectedDateObj = null;
            
            // 1. Quitamos visualmente la selección de los horarios
            document.querySelectorAll('.espacio-tiempo').forEach(slot => {
                slot.classList.remove('selected');
            });
            
            // 2. Ocultamos el botón de confirmar horario si estaba visible
            const confirmBtn = id('confirm-time-btn');
            if (confirmBtn) confirmBtn.style.display = 'none';
            // -----------------------------
            
            renderConsoles();
            toggleCart();
        }

        function updateCartUI() {
            id('cart-badge').innerText = cart.length;
            const container = id('cart-items');
            const totalContainer = id('cart-total');

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim);">El carrito está vacío.</p>';
                totalContainer.style.display = 'none';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="elemento-carrito" style="margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${item.console}</strong> - ${item.game}<br>
                            <small style="color: var(--text-dim);">${item.hours} | 📅 ${item.date}</small>
                        </div>
                        <div>
                            <span style="color: var(--neon-red); font-weight: bold; margin-right: 10px;">$${item.price.toLocaleString('es-AR')}</span>
                            <button onclick="removeItem(${index})" style="background:none; border:none; color:#ff4444; cursor:pointer;">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalContainer.style.display = 'block';
            totalContainer.innerText = `Total: $${total.toLocaleString('es-AR')}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = id('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function finishPurchase() {
            if (cart.length === 0) return alert('El carrito está vacío.');
            alert('¡Reserva completada con éxito! Te esperamos en ZUMMIT.');
            cart = [];
            updateCartUI();
            toggleCart();
        }

        function goBack() {
            if (currentStep === 4) {
                selectGame(selectedGame);
            } else if (currentStep === 3) {
                selectConsole(selectedConsole);
            } else if (currentStep === 2) {
                renderConsoles();
            } else {
                renderConsoles();
            }
        }

        function updateStepIndicators() {
            id('step-1').className = currentStep === 1 ? 'active' : '';
            id('step-2').className = currentStep === 2 ? 'active' : '';
            id('step-3').className = currentStep === 3 ? 'active' : '';
            id('step-4').className = currentStep === 4 ? 'active' : '';
        }

        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 40) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
        renderConsoles();
    </script>
</body>
</html>
